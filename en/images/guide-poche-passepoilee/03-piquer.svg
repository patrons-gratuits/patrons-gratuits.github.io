<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Vue de dessus -->
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <!-- cadre (sous les passepoils) -->
    <rect x="90" y="92" width="180" height="36" fill="none" stroke="#fbf1e4" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- passepoil haut : pli au centre, bord vif vers le haut -->
    <rect x="62" y="68" width="236" height="42" fill="#94604b"/>
    <line x1="62" y1="110" x2="298" y2="110" stroke="#dcae99" stroke-width="2"/>
    <!-- passepoil bas -->
    <rect x="62" y="110" width="236" height="42" fill="#94604b"/>
    <line x1="62" y1="110" x2="298" y2="110" stroke="#dcae99" stroke-width="2"/>
    <line x1="62" y1="110.5" x2="298" y2="110.5" stroke="#5e3426" stroke-width="0.8"/>
    <!-- piqûres sur les grands côtés du cadre -->
    <line x1="90" y1="92" x2="270" y2="92" stroke="#fbf1e4" stroke-width="1.8" stroke-dasharray="5 3"/>
    <line x1="90" y1="128" x2="270" y2="128" stroke="#fbf1e4" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- points d'arrêt -->
    <g fill="#fbf1e4"><circle cx="90" cy="92" r="3"/><circle cx="270" cy="92" r="3"/><circle cx="90" cy="128" r="3"/><circle cx="270" cy="128" r="3"/></g>
    <text x="180" y="52" text-anchor="middle" fill="#fbf1e4">piquer sur les lignes tracées</text>
    <text x="180" y="180" text-anchor="middle" fill="#fbf1e4">d’un bout à l’autre du cadre,</text>
    <text x="180" y="197" text-anchor="middle" fill="#fbf1e4">avec un point d’arrêt à chaque extrémité</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Étape 3 : piquer les passepoils</text>
  </g>
  </svg>
