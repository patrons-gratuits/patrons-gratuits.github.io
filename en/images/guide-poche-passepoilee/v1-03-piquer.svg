<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <rect x="62" y="110" width="236" height="54" fill="#94604b"/>
    <line x1="62" y1="164" x2="298" y2="164" stroke="#dcae99" stroke-width="2"/>
    <line x1="62" y1="110.6" x2="298" y2="110.6" stroke="#5e3426" stroke-width="1.2"/>
    <!-- piqûre du haut, vêtement seul -->
    <line x1="90" y1="92" x2="270" y2="92" stroke="#fbf1e4" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- piqûre du bas, sur le passepoil -->
    <line x1="90" y1="128" x2="270" y2="128" stroke="#fbf1e4" stroke-width="1.8" stroke-dasharray="5 3"/>
    <g fill="#fbf1e4"><circle cx="90" cy="92" r="3"/><circle cx="270" cy="92" r="3"/><circle cx="90" cy="128" r="3"/><circle cx="270" cy="128" r="3"/></g>
    <text x="180" y="80" text-anchor="middle" fill="#fbf1e4" font-size="12">haut : vêtement seul</text>
    <text x="180" y="150" text-anchor="middle" fill="#fbf1e4" font-size="12">bas : à travers le passepoil</text>
    <text x="180" y="40" text-anchor="middle" fill="#fbf1e4">piquer sur les deux lignes tracées,</text>
    <text x="180" y="56" text-anchor="middle" fill="#fbf1e4">d&#8217;un bout à l&#8217;autre du cadre</text>
    <text x="180" y="192" text-anchor="middle" fill="#fbf1e4">point d&#8217;arrêt à chaque extrémité</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Un passepoil – étape 3 : piquer</text>
  </g>
</svg>
