<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <rect x="60" y="58" width="240" height="162" fill="none" stroke="#5e3426" stroke-dasharray="4 3"/>
    <polygon points="90,104 72,110 90,116" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="2 2"/>
    <polygon points="270,104 288,110 270,116" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="2 2"/>
    <rect x="90" y="104" width="180" height="12" fill="#efe3cf" stroke="#5e3426" stroke-width="1.4"/>
    <polyline points="85,104 85,121 275,121 275,104" fill="none" stroke="#fbf1e4" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="180" y="40" text-anchor="middle" fill="#fbf1e4">surpiquer à 3–4 mm de la fente : côtés et bas,</text>
