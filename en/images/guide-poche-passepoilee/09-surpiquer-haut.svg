<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <rect x="62" y="68" width="236" height="84" fill="none" stroke="#5e3426" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="90" y="92" width="180" height="18" fill="#94604b"/>
    <rect x="90" y="110" width="180" height="18" fill="#94604b"/>
    <line x1="90" y1="110" x2="270" y2="110" stroke="#1d1d1d" stroke-opacity="0.5" stroke-width="1.4"/>
    <polyline points="85,92 85,133 275,133 275,92" fill="none" stroke="#fbf1e4" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 2"/>
    <!-- surpiqûre haut -->
    <polyline points="85,96 85,87 275,87 275,96" fill="none" stroke="#fbf1e4" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="180" y="44" text-anchor="middle" fill="#fbf1e4">surpiquer le haut à 3–4 mm du cadre,</text>
    <text x="180" y="60" text-anchor="middle" fill="#fbf1e4">à travers le dessous de poche</text>
    <text x="180" y="178" text-anchor="middle" fill="#fbf1e4">la surpiqûre rejoint celle des côtés ;</text>
    <text x="180" y="194" text-anchor="middle" fill="#fbf1e4">arrêter les points</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Étape 9 : surpiquer le haut</text>
  </g>
</svg>
