<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="300" rx="6" fill="#dcae99"/>
    <!-- passepoils + triangles -->
    <rect x="62" y="70" width="236" height="80" fill="#94604b"/>
    <line x1="62" y1="110" x2="298" y2="110" stroke="#5e3426" stroke-width="1"/>
    <!-- marges de la fente retournées sur l'envers -->
    <polygon points="90,92 270,92 252,74 108,74" fill="#555" fill-opacity="0.22" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <polygon points="90,128 270,128 252,146 108,146" fill="#555" fill-opacity="0.22" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <line x1="90" y1="92" x2="270" y2="92" stroke="#5e3426" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="90" y1="128" x2="270" y2="128" stroke="#5e3426" stroke-width="1.2" stroke-dasharray="5 3"/>
    <polygon points="90,92 72,110 90,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <polygon points="270,92 288,110 270,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <!-- dessus de poche déjà cousu, rabattu -->
    <path d="M50,140 H310 V250 Q310,268 292,268 H68 Q50,268 50,250 Z" fill="#efe3cf" stroke="#94604b"/>
    <!-- dessous de poche, posé par-dessus -->
    <path d="M50,64 H310 V250 Q310,268 292,268 H68 Q50,268 50,250 Z" fill="#f6efe4" fill-opacity="0.78" stroke="#5e3426" stroke-width="1.4"/>
    <!-- garniture, dessous, tournée vers l'ouverture -->
    <rect x="62" y="70" width="236" height="62" fill="none" stroke="#94604b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="180" y="125" text-anchor="middle" fill="#5e3426" font-size="12">garniture (dessous)</text>
    <!-- couture sur le bord libre du passepoil du haut -->
    <line x1="50" y1="72" x2="310" y2="72" stroke="#4a2a1e" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="180" y="200" text-anchor="middle" fill="#5e3426">dessous de poche</text>
    <text x="180" y="34" text-anchor="middle" fill="#5e3426">coudre le haut du dessous de poche sur le bord libre</text>
    <text x="180" y="50" text-anchor="middle" fill="#5e3426">du passepoil du haut, garniture vers l&#8217;ouverture</text>
    <text x="180" y="290" text-anchor="middle" fill="#5e3426">sans prendre le vêtement</text>
    <text x="180" y="340" text-anchor="middle" fill="#333" font-weight="bold">Étape 8 : coudre le dessous de poche</text>
  </g>
</svg>
