<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <!-- sac retourné posé endroit contre endroit -->
    <path d="M60,58 H300 V220 H60 Z" fill="#efe3cf" stroke="#94604b"/>
    <!-- cadre dessous, en transparence -->
    <rect x="90" y="104" width="180" height="12" fill="none" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <line x1="315" y1="58" x2="315" y2="104" stroke="#fbf1e4"/><line x1="310" y1="58" x2="320" y2="58" stroke="#fbf1e4"/><line x1="310" y1="104" x2="320" y2="104" stroke="#fbf1e4"/>
    <text x="324" y="85" fill="#fbf1e4" font-size="11">2 cm</text>
    <text x="180" y="150" text-anchor="middle" fill="#5e3426">dessus de poche retourné,</text>
    <text x="180" y="166" text-anchor="middle" fill="#5e3426">endroit contre endroit du vêtement</text>
    <text x="180" y="30" text-anchor="middle" fill="#fbf1e4">centrer le dessus de poche retourné sur le cadre,</text>
    <text x="180" y="46" text-anchor="middle" fill="#fbf1e4">son haut 2 cm au-dessus du cadre</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Poche fendue avec rabat – étape 2 : poser le dessus de poche retourné</text>
  </g>
</svg>
