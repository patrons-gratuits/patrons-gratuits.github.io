<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <!-- passepoils sous le vêtement (vus en transparence) -->
    <rect x="62" y="68" width="236" height="84" fill="none" stroke="#5e3426" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- lèvres dans l'ouverture -->
    <rect x="90" y="92" width="180" height="18" fill="#94604b"/>
    <rect x="90" y="110" width="180" height="18" fill="#94604b"/>
    <line x1="90" y1="110" x2="270" y2="110" stroke="#1d1d1d" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="90" y="92" width="180" height="36" fill="none" stroke="#5e3426" stroke-width="1"/>
    <text x="180" y="44" text-anchor="middle" fill="#fbf1e4">passer les passepoils et les triangles</text>
    <text x="180" y="60" text-anchor="middle" fill="#fbf1e4">par l&#8217;ouverture, vers l&#8217;envers</text>
    <text x="180" y="178" text-anchor="middle" fill="#fbf1e4">ajuster les lèvres : plis jointifs au centre,</text>
    <text x="180" y="194" text-anchor="middle" fill="#fbf1e4">largeur égale ; repasser</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Étape 5 : retourner (endroit)</text>
  </g>
</svg>
