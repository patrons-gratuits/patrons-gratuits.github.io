<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect y="-14" width="360" height="314" rx="6" fill="#dcae99"/>
    <!-- passepoils sur l'envers -->
    <rect x="62" y="92" width="236" height="58" fill="#94604b"/>
    <line x1="90" y1="128" x2="270" y2="128" stroke="#5e3426" stroke-width="1.2" stroke-dasharray="5 3"/>
    <!-- marge du bas de la fente, retournée sur l'envers -->
    <polygon points="90,128 270,128 252,146 108,146" fill="#c1846c" stroke="#5e3426" stroke-width="1"/>
    <line x1="90" y1="128" x2="270" y2="128" stroke="#fbf1e4" stroke-width="1.2" stroke-dasharray="4 2"/>
    <!-- marge du haut de la fente, retournée sur l'envers -->
    <polygon points="90,92 270,92 252,74 108,74" fill="#c1846c" stroke="#5e3426" stroke-width="1"/>
    <line x1="90" y1="92" x2="270" y2="92" stroke="#fbf1e4" stroke-width="1.2" stroke-dasharray="4 2"/>
    <polygon points="90,92 72,110 90,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <polygon points="270,92 288,110 270,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <!-- dessus de poche : haut sur la marge du haut, garniture vers l&#8217;ouverture -->
    <path d="M50,140 H310 V250 Q310,268 292,268 H68 Q50,268 50,250 Z" fill="#efe3cf" fill-opacity="0.95" stroke="#94604b"/>
    <line x1="50" y1="146" x2="310" y2="146" stroke="#4a2a1e" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- marge du rabat, sous le dessous de poche -->
    <rect x="90" y="68" width="180" height="24" fill="#cd977f" stroke="#5e3426" stroke-width="1"/>
    <!-- dessous de poche cousu sur la marge du haut -->
    <path d="M50,46 H310 V250 Q310,268 292,268 H68 Q50,268 50,250 Z" fill="#f6efe4" fill-opacity="0.78" stroke="#5e3426" stroke-width="1.4"/>
    <rect x="62" y="52" width="236" height="82" fill="none" stroke="#94604b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="180" y="125" text-anchor="middle" fill="#5e3426" font-size="12">garniture (dessous)</text>
    <line x1="95" y1="58" x2="95" y2="84" stroke="#555" stroke-width="1.4"/><circle cx="95" cy="58" r="3" fill="#b03030"/><line x1="150" y1="58" x2="150" y2="84" stroke="#555" stroke-width="1.4"/><circle cx="150" cy="58" r="3" fill="#b03030"/><line x1="210" y1="58" x2="210" y2="84" stroke="#555" stroke-width="1.4"/><circle cx="210" cy="58" r="3" fill="#b03030"/><line x1="265" y1="58" x2="265" y2="84" stroke="#555" stroke-width="1.4"/><circle cx="265" cy="58" r="3" fill="#b03030"/>
    <text x="180" y="200" text-anchor="middle" fill="#5e3426">dessous de poche</text>
    <text x="180" y="12" text-anchor="middle" fill="#5e3426">placer le dessous de poche par-dessus la marge du rabat,</text>
    <text x="180" y="28" text-anchor="middle" fill="#5e3426">garniture vers l&#8217;ouverture, 2 cm au-dessus de la fente</text>
    <text x="180" y="290" text-anchor="middle" fill="#5e3426">épingler ou bâtir, puis retourner sur l&#8217;endroit</text>
    <text x="180" y="340" text-anchor="middle" fill="#333" font-weight="bold">Un passepoil avec rabat – étape 8 : placer le dessous de poche</text>
  </g>
</svg>
