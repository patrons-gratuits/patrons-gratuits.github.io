<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <rect x="62" y="68" width="236" height="84" fill="none" stroke="#5e3426" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="90" y="92" width="180" height="18" fill="#94604b"/>
    <rect x="90" y="110" width="180" height="18" fill="#94604b"/>
    <line x1="90" y1="110" x2="270" y2="110" stroke="#1d1d1d" stroke-opacity="0.5" stroke-width="1.4"/>
    <polygon points="90,92 72,110 90,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <polygon points="270,92 288,110 270,128" fill="#555" fill-opacity="0.35" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <!-- surpiqûre côtés + bas -->
    <polyline points="85,92 85,133 275,133 275,92" fill="none" stroke="#fbf1e4" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="180" y="44" text-anchor="middle" fill="#fbf1e4">surpiquer à 3–4 mm du cadre : côtés et bas,</text>
    <text x="180" y="60" text-anchor="middle" fill="#fbf1e4">en prenant les pointes et le dessus de poche</text>
    <text x="180" y="178" text-anchor="middle" fill="#fbf1e4">le haut reste libre : le dessous de poche</text>
    <text x="180" y="194" text-anchor="middle" fill="#fbf1e4">n&#8217;est pas encore posé</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Étape 7 : surpiquer les côtés et le bas</text>
  </g>
</svg>
