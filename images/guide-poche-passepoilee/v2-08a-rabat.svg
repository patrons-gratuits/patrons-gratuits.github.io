<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <g transform="translate(20,20)">
    <rect width="360" height="220" rx="6" fill="#c1846c"/>
    <!-- lèvre unique dans l'ouverture (cachée en partie) -->
    <rect x="90" y="92" width="180" height="36" fill="#94604b"/>
    <!-- surpiqûre côtés + bas déjà faite (sous le rabat) -->
    <!-- marge du rabat glissée sous le bord haut (transparence) -->
    <rect x="90" y="68" width="180" height="24" fill="#555" fill-opacity="0.22" stroke="#444" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <!-- rabat qui retombe -->
    <path d="M87,92 H273 V160 Q273,174 259,174 H101 Q87,174 87,160 Z" fill="#cd977f" stroke="#5e3426"/>
    <path d="M93,94 V158 Q93,168 103,168 H257 Q267,168 267,158 V94" fill="none" stroke="#fbf1e4" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="87" y1="92" x2="273" y2="92" stroke="#5e3426" stroke-width="1.4"/>
    <text x="180" y="138" text-anchor="middle" fill="#4a2a1e">rabat</text>
    <text x="180" y="34" text-anchor="middle" fill="#fbf1e4">glisser la marge du rabat dans l&#8217;ouverture,</text>
    <text x="180" y="50" text-anchor="middle" fill="#fbf1e4">sous le bord du haut (en grisé)</text>
    <text x="180" y="198" text-anchor="middle" fill="#fbf1e4">le rabat retombe sur l&#8217;ouverture ; centrer, épingler</text>
    <text x="180" y="250" text-anchor="middle" fill="#333" font-weight="bold">Un passepoil avec rabat – étape 8 : glisser le rabat (endroit)</text>
  </g>
</svg>
